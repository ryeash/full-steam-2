micronaut:
  application:
    name: full-steam
  server:
    port: ${SERVER_PORT:8080}
    max-request-size: 2KB
    netty:
      worker:
        threads: 8
      max-header-size: 8192
      websocket:
        compression: false # no need to compress because we byte pack
      child-options:
        tcp-nodelay: true
        so-keepalive: true
  executors:
    scheduled:
      type: scheduled
      core-pool-size: 8
  jackson:
    bean-introspection-module: true
endpoints:
  all:
    enabled: false
    sensitive: false
  health:
    enabled: true
    sensitive: false
    details-visible: NEVER

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:}
  frame-ancestors: ${APP_FRAME_ANCESTORS:}
