buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'io.micronaut.application' version "5.0.2"
    id 'com.gradleup.shadow' version "9.6.1"
}

group = 'com.fullsteam'
version = '1.0.0-SNAPSHOT'

ext {
    lombokVersion = "1.18.48"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

micronaut {
    version = "5.2.1"
}

dependencies {
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("io.micronaut:micronaut-core")
    annotationProcessor("io.micronaut:micronaut-inject-java")

    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    implementation("io.micronaut:micronaut-http-server-netty")
    implementation("io.micronaut:micronaut-websocket")
    implementation("io.micronaut:micronaut-management")
    implementation("io.micronaut:micronaut-jackson-databind")
    implementation("io.micronaut:micronaut-runtime")
    implementation("io.micronaut:micronaut-inject")
    implementation("ch.qos.logback:logback-classic")
    implementation("io.micronaut.validation:micronaut-validation")
    runtimeOnly("org.yaml:snakeyaml")

    implementation("org.apache.commons:commons-lang3:3.20.0")
    implementation("commons-io:commons-io:2.22.0")
    implementation("org.dyn4j:dyn4j:6.0.0")

    testAnnotationProcessor("io.micronaut:micronaut-inject-java")
    testImplementation("io.micronaut.test:micronaut-test-junit5")
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()

    // Test output configuration
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showCauses true
        showExceptions true
        showStackTraces true
    }

    // Performance optimizations for faster test execution
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    forkEvery = 100

    // JVM args for Java 25 compatibility
    jvmArgs += [
            '--enable-native-access=ALL-UNNAMED',
            '-XX:+UseG1GC',
            '-Xms256m',
            '-Xmx1024m'
    ]
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.fullsteam.Application'
        )
    }
}
